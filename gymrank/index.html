<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymRank" />
  <meta name="theme-color" content="#101318" />
  <title>GymRank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap" />
  <style>
    :root { --bg:#101318; --panel:#181c23; --line:#272d37; --text:#eef0f3; --muted:#8c95a3; --c:#3a414d;
      --display:'Big Shoulders Display', system-ui, sans-serif; color-scheme:dark; }
    :root { padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--bg); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
    main { max-width:480px; margin:auto; padding-block:14px 24px;
      padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
    header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    h1 { margin:0; flex:1; font:800 32px/1 var(--display); letter-spacing:.02em; }
    h3 { margin:0 0 10px; font:700 22px/1 var(--display); letter-spacing:.02em; }
    small { display:block; color:var(--muted); font-size:13px; }
    button { font:inherit; color:inherit; border:0; cursor:pointer; }
    :focus-visible { outline:2px solid var(--text); outline-offset:2px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:14px; }
    .flex { display:flex; gap:14px; align-items:center; }
    .grow { flex:1; min-width:0; }
    #me { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:14px; }

    .emblem { display:block; flex:none; overflow:visible; }
    .empty .emblem, .hero.none > .emblem { filter:grayscale(1); opacity:.3; }
    .tier-name { margin:0; font:800 48px/1 var(--display); letter-spacing:.03em; text-transform:uppercase; color:color-mix(in srgb,var(--c),#fff 35%); }
    .tier { font:800 16px/1 var(--display); letter-spacing:.04em; text-transform:uppercase; color:color-mix(in srgb,var(--c),#fff 25%); white-space:nowrap; }
    .sub { margin:6px 0 0; color:var(--muted); font-size:14px; }

    .bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:8px 0 5px; }
    .bar i { display:block; height:100%; border-radius:inherit; transition:width .5s;
      background:linear-gradient(90deg,color-mix(in srgb,var(--c),#000 25%),color-mix(in srgb,var(--c),#fff 30%)); }

    /* Ô hạng tổng: huy hiệu đứng giữa "sân khấu" ánh màu của hạng */
    .hero { text-align:center; padding:24px 18px 18px; border-color:color-mix(in srgb,var(--c) 40%,var(--line));
      background:radial-gradient(110% 65% at 50% 28%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),var(--panel); }
    .hero > .emblem { width:150px; margin:0 auto 6px; filter:drop-shadow(0 10px 26px color-mix(in srgb,var(--c) 55%,transparent)); }
    .hero .bar { margin-top:14px; }
    .ladder { display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding:0 4px; }
    .ladder .emblem { width:30px; opacity:.22; filter:grayscale(1); }
    .ladder .done { opacity:.65; filter:none; }
    .ladder .now { width:42px; opacity:1; filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent)); }
    .bar.seg { position:relative; }
    .bar.seg::after { content:""; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent calc(100%/3 - 1.5px),var(--panel) 0 calc(100%/3 + 1.5px),transparent 0 calc(200%/3 - 1.5px),var(--panel) 0 calc(200%/3 + 1.5px),transparent 0); }

    label { display:block; font-size:13px; color:var(--muted); }
    select, input[type=number] { width:100%; margin-top:4px; padding:12px; font:inherit; font-size:16px; color:var(--text);
      background:var(--bg); border:1px solid var(--line); border-radius:12px; }
    .row { display:flex; gap:10px; margin:10px 0 14px; }
    .row label { flex:1; }
    #preview { min-height:64px; margin-bottom:14px; }
    #preview > .emblem { width:64px; }
    .primary { width:100%; padding:14px; border-radius:14px; background:var(--text); color:var(--bg); font-weight:700; }
    .primary:disabled { opacity:.3; }
    #msg { text-align:center; font-weight:600; margin-top:10px; min-height:1.4em; }

    ul { list-style:none; margin:0; padding:0; }
    li { display:flex; gap:12px; align-items:center; padding:12px 0; cursor:pointer; }
    li + li { border-top:1px solid var(--line); }
    li > .emblem { width:52px; }
    li .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    li.empty b { color:var(--muted); font-weight:500; }
    .del { background:none; color:var(--muted); padding:8px; font-size:15px; }

    dialog { width:min(92vw,380px); background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:22px; padding:20px; }
    dialog::backdrop { background:#000b; }
    dialog h2 { margin:0; font:800 30px/1.1 var(--display); }
    fieldset { border:0; padding:0; margin:14px 0; display:flex; gap:10px; }
    fieldset label { flex:1; text-align:center; padding:11px; border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:16px; }
    fieldset label:has(input:checked) { border-color:var(--text); background:#ffffff14; }
    fieldset input { position:absolute; opacity:0; pointer-events:none; }
    fieldset label:has(input:focus-visible) { outline:2px solid var(--text); outline-offset:2px; }
    .hero .primary { margin-top:16px; }

    /* Màn hình lên hạng: khoảnh khắc chuyển động duy nhất của app */
    #levelup { text-align:center; border-color:color-mix(in srgb,var(--c) 50%,var(--line));
      background:radial-gradient(90% 60% at 50% 35%,color-mix(in srgb,var(--c) 40%,transparent),transparent 72%),var(--panel); }
    #levelup .emblem { width:180px; margin:4px auto 8px; filter:drop-shadow(0 12px 30px color-mix(in srgb,var(--c) 60%,transparent)); }
    #levelup[open] .emblem { animation:pop .8s cubic-bezier(.2,1.5,.4,1) both; }
    #levelup[open] .tier-name { animation:rise .5s .35s both; }
    #levelup .primary { margin-top:20px; }
    @keyframes pop { from { transform:scale(.3) rotate(-15deg); opacity:0; } }
    @keyframes rise { from { transform:translateY(10px); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { *, *::before { animation:none !important; transition:none !important; } }

    footer { margin-top:18px; text-align:center; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>GymRank</h1>
    <button id="me" type="button" aria-label="Sửa giới tính và cân nặng"></button>
  </header>

  <section id="overall" class="panel hero" aria-live="polite"></section>

  <section class="panel">
    <h3>Ghi mức tạ</h3>
    <label>Bài tập <select id="ex"></select></label>
    <div class="row">
      <label><span id="kgLabel">Tạ (kg)</span><input id="kg" type="number" inputmode="decimal" step="0.5" /></label>
      <label>Số rep<input id="reps" type="number" inputmode="numeric" min="1" max="30" step="1" /></label>
    </div>
    <div id="preview" class="flex"></div>
    <button id="save" class="primary" type="button" disabled>Lưu kỷ lục</button>
    <div id="msg" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h3>Kỷ lục từng bài</h3>
    <ul id="list"></ul>
  </section>

  <footer><small>Ngưỡng xếp hạng là ước tính tham khảo, không phải chuẩn chính thức. 1RM tính theo công thức Epley.</small></footer>
</main>

<dialog id="profile">
  <form method="dialog">
    <h2>Thông tin của bạn</h2>
    <small>Dùng để tính sức mạnh so với cân nặng.</small>
    <fieldset>
      <label><input type="radio" name="sex" value="m" checked />Nam</label>
      <label><input type="radio" name="sex" value="f" />Nữ</label>
    </fieldset>
    <label>Cân nặng (kg)<input id="bw" type="number" inputmode="decimal" min="30" max="250" step="0.1" required /></label>
    <button class="primary" style="margin-top:16px">Xong</button>
  </form>
</dialog>

<dialog id="levelup">
  <form method="dialog">
    <div id="luBody"></div>
    <button class="primary">Tiếp tục tập</button>
  </form>
</dialog>

<script type="module">
  import { TIERS, SUBS, TOP, EXERCISES, rate, overall, label } from './rank.js';

  const $ = id => document.getElementById(id);
  const KEY = 'gymrank';
  const state = { sex: 'm', bw: 0, best: {} };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY))); } catch {}

  // Trong Claude Artifact: lưu thêm vào kho riêng của tài khoản (data/users/<id>), mở máy khác vẫn còn.
  // Ngoài Artifact (GitHub Pages) window.claude không có, app chỉ dùng localStorage.
  let remote = null, touched = false, writing = Promise.resolve();
  const persist = () => {
    touched = true;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    if (remote) { const body = structuredClone(state); writing = writing.then(() => remote.set(body)).catch(() => {}); }
  };
  (async () => {
    const [db, user] = await Promise.all([window.claude?.use('db'), window.claude?.use('user')]);
    const uid = db && user && await user.id();
    if (!uid) return;
    const ref = db.doc(`data/users/${uid}/gymrank`);
    try {
      const snap = await ref.get();
      remote = ref;
      if (snap.exists && !touched) {
        Object.assign(state, structuredClone(snap.data()));
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
        render();
        preview();
      } else if (touched || state.bw) persist();
    } catch {}
  })();

  // confirm() không chạy trong Artifact, nên xác nhận bằng cách bấm lần thứ hai.
  let armed = '';
  const second = (key, btn, label) => {
    if (armed === key) { armed = ''; return true; }
    armed = key;
    btn.textContent = label;
    return false;
  };

  // Huy hiệu SVG: Gỗ có vân, Sắt có đinh tán, từ Bạc có cánh, Bạch kim có vương miện, Kim cương có đá quý,
  // Cao thủ cánh đôi + 3 viên đá, Huyền thoại thêm hào quang. Hạt nhỏ dưới khiên = bậc phụ I/II/III.
  const mix = (hex, to, a) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - a) + to * a).toString(16).padStart(2, '0')).join('');
  document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${TIERS.map((t, i) => `
    <linearGradient id="m${i}" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="${mix(t.color, 255, .55)}"/><stop offset=".47" stop-color="${t.color}"/>
      <stop offset=".53" stop-color="${mix(t.color, 0, .35)}"/><stop offset="1" stop-color="${mix(t.color, 255, .2)}"/>
    </linearGradient>`).join('')}</defs></svg>`);
  const SHIELD = 'M60 16 L94 29 L90 70 Q86 90 60 104 Q34 90 30 70 L26 29 Z';
  const WING = 'M31 40 L4 32 L12 45 L1 50 L13 58 L6 67 L31 66 Z';
  const WING2 = 'M33 36 L12 13 L15 27 L4 28 L31 50 Z';
  const CROWN = 'M38 28 L40 1 L51 13 L60 -5 L69 13 L80 1 L82 28 Z';
  const BARBELL = 'M38 58h44v4H38z M43 49h5v22h-5z M72 49h5v22h-5z M49 52h3v16h-3z M68 52h3v16h-3z';
  const GLOSS = 'M28 30.5 L60 18 L92 30.5 L91.4 42 Q60 30 28.8 46 Z';
  const GRAIN = 'M33 38 Q60 31 87 38 M37 82 Q60 88 83 82 M46 93 Q60 97 74 93';
  const gem = (x, y, s) => `<path d="M${x} ${y - s}L${x + s * .75} ${y}L${x} ${y + s}L${x - s * .75} ${y}Z" fill="#e4f7ff" stroke="#fff" stroke-width="1.2"/>`;
  function emblem(t, sub) {
    const f = `url(#m${t})`, c = TIERS[t].color, dark = mix(c, 0, .55);
    const wing = (d, s) => `<path d="${d}" fill="${f}" stroke="${dark}" stroke-width="1.5" transform="translate(31 54) scale(${s}) translate(-31 -54)"/>`;
    const pair = (d, s) => wing(d, s) + `<g transform="matrix(-1 0 0 1 120 0)">${wing(d, s)}</g>`;
    const w = [0, 0, 0, .6, .85, .95, 1, 1, 1][t];
    return `<svg class="emblem" viewBox="0 -8 120 128" aria-hidden="true">
      ${t === TOP ? `<circle cx="60" cy="58" r="52" fill="${c}" opacity=".22"/>` + [...Array(16)].map((_, i) =>
        `<path d="M60 58 L58.5 ${i % 2 ? 4 : -10} L61.5 ${i % 2 ? 4 : -10} Z" fill="${mix(c, 255, .45)}" opacity=".55" transform="rotate(${i * 22.5} 60 58)"/>`).join('') : ''}
      ${t >= 7 ? pair(WING2, 1) : ''}
      ${w ? pair(WING, w) : ''}
      ${t >= 5 ? `<path d="${CROWN}" fill="${f}" stroke="${dark}" stroke-width="1.5"/>` : ''}
      ${t >= 6 ? gem(60, -6, 8) : ''}
      ${t >= 7 ? gem(40, 2, 4.5) + gem(80, 2, 4.5) : ''}
      <path d="${SHIELD}" fill="${f}" stroke="${dark}" stroke-width="2.5"/>
      <path d="${GLOSS}" fill="#fff" opacity=".16"/>
      ${t === 0 ? `<path d="${GRAIN}" fill="none" stroke="${dark}" stroke-opacity=".5" stroke-width="1.6"/>` : ''}
      ${t === 1 ? [[36, 36], [84, 36], [40, 79], [80, 79]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${mix(c, 255, .5)}" stroke="${dark}"/>`).join('') : ''}
      ${t >= 2 ? `<path d="${SHIELD}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" transform="translate(60 60) scale(.8) translate(-60 -60)"/>` : ''}
      <path d="${BARBELL}" fill="${mix(c, 0, .65)}" fill-opacity=".85"/>
      ${sub != null && t < TOP ? [...Array(sub + 1)].map((_, i) => { const x = 60 + (i - sub / 2) * 11;
        return `<path d="M${x} 106L${x + 4} 111L${x} 116L${x - 4} 111Z" fill="${mix(c, 255, .45)}" stroke="${dark}" stroke-width="1.2"/>`; }).join('') : ''}
    </svg>`;
  }

  const fmt = n => (Math.round(n * 10) / 10).toLocaleString('vi-VN');
  // seg: thanh chia 3 khúc ứng với 3 bậc phụ
  const bar = (p, seg) => `<div class="bar${seg ? ' seg' : ''}"><i style="width:${p * 100}%"></i></div>`;
  const load = (id, kg) => !EXERCISES[id].bw ? `${fmt(kg)} kg` : kg ? `Cân nặng ${kg > 0 ? '+' : '−'} ${fmt(Math.abs(kg))} kg` : 'Cân nặng';
  const next = (r, reps) => r.next ? `Thêm ${fmt(r.next.kg)} kg × ${reps} rep để lên ${label(r.next.tier, r.next.sub)}` : 'Đã ở hạng cao nhất';
  const level = r => (r ? r.tier * SUBS.length + r.sub : -1);

  let overallNow = null;
  function render() {
    $('me').textContent = state.bw ? `${state.sex === 'f' ? 'Nữ' : 'Nam'}, ${fmt(state.bw)} kg` : 'Nhập cân nặng';
    const scores = [];
    $('list').innerHTML = Object.entries(EXERCISES).map(([id, ex]) => {
      const b = state.best[id];
      if (!b || !state.bw) return `<li class="empty" data-id="${id}">${emblem(0)}
        <div class="grow"><b>${ex.name}</b><small>Chưa có kỷ lục. Chạm để ghi.</small></div></li>`;
      const r = rate(id, state.sex, state.bw, b.kg, b.reps);
      scores.push(r.score);
      return `<li data-id="${id}" style="--c:${TIERS[r.tier].color}">${emblem(r.tier, r.sub)}
        <div class="grow"><div class="head"><b>${ex.name}</b><span class="tier">${label(r.tier, r.sub)}</span></div>
        <small>${load(id, b.kg)} × ${b.reps} rep, 1RM ước tính ${fmt(r.oneRm)} kg</small>
        ${bar(r.progress, r.tier < TOP)}<small>${next(r, b.reps)}</small></div>
        <button class="del" data-del="${id}" aria-label="Xóa kỷ lục ${ex.name}">✕</button></li>`;
    }).join('');

    const o = overall(scores), t = o ? o.tier : 0, hero = $('overall');
    hero.style.setProperty('--c', o ? TIERS[t].color : '#3a414d');
    hero.classList.toggle('none', !o);
    hero.innerHTML = `${emblem(t, o?.sub)}
      <h2 class="tier-name">${o ? label(t, o.sub) : 'Chưa có hạng'}</h2>
      <p class="sub">${o ? `Hạng tổng, trung bình ${scores.length} bài` : state.bw ? 'Ghi mức tạ đầu tiên bên dưới để nhận hạng' : 'Nhập cân nặng để bắt đầu xếp hạng'}</p>
      ${state.bw ? '' : '<button id="start" class="primary" type="button">Nhập cân nặng</button>'}
      <div class="ladder" aria-hidden="true">${TIERS.map((_, i) => emblem(i).replace('class="emblem"', `class="emblem ${!o ? '' : i < t ? 'done' : i === t ? 'now' : ''}"`)).join('')}</div>
      ${o ? `${bar(o.progress, t < TOP)}<small>${t < TOP ? `Tiến độ lên ${TIERS[t + 1].name}: ${Math.round(o.progress * 100)}%` : 'Bạn đã ở hạng cao nhất'}</small>` : ''}`;
    overallNow = o;
  }

  function preview() {
    const id = $('ex').value, kg = parseFloat($('kg').value), reps = Number($('reps').value);
    const bw = EXERCISES[id].bw;
    $('kgLabel').textContent = bw ? 'Tạ đeo thêm (kg)' : 'Tạ (kg)';
    const ok = state.bw > 0 && Number.isFinite(kg) && Number.isInteger(reps) && reps >= 1 && reps <= 30 && (bw ? state.bw + kg > 0 : kg > 0);
    $('save').disabled = !ok;
    if (!ok) {
      $('preview').style.removeProperty('--c');
      $('preview').innerHTML = `<small>${state.bw ? (bw ? 'Không đeo tạ thì nhập 0, dùng máy hỗ trợ thì nhập số âm. Số rep từ 1 đến 30.' : 'Nhập số kg và số rep (1–30) để xem hạng.') : 'Bấm “Nhập cân nặng” ở góc trên trước.'}</small>`;
      return null;
    }
    const r = rate(id, state.sex, state.bw, kg, reps);
    $('preview').style.setProperty('--c', TIERS[r.tier].color);
    $('preview').innerHTML = `${emblem(r.tier, r.sub)}<div class="grow"><span class="tier" style="font-size:22px">${label(r.tier, r.sub)}</span>
      <small>1RM ước tính ${fmt(r.oneRm)} kg, gấp ${r.ratio.toLocaleString('vi-VN', { maximumFractionDigits: 2 })} lần cân nặng${reps > 10 ? '. Trên 10 rep thì ước tính kém chính xác.' : ''}</small>
      ${bar(r.progress, r.tier < TOP)}<small>${next(r, reps)}</small></div>`;
    return { id, kg, reps, r };
  }

  function levelUp(r, text) {
    $('levelup').style.setProperty('--c', TIERS[r.tier].color);
    $('luBody').innerHTML = `${emblem(r.tier, r.sub)}<p class="sub">${text}</p><h2 class="tier-name">${label(r.tier, r.sub)}</h2>`;
    $('levelup').showModal();
  }

  $('ex').innerHTML = Object.entries(EXERCISES).map(([id, e]) => `<option value="${id}">${e.name}</option>`).join('');
  for (const el of [$('ex'), $('kg'), $('reps')]) el.addEventListener('input', () => {
    $('msg').textContent = '';
    armed = '';
    $('save').textContent = 'Lưu kỷ lục';
    preview();
  });

  $('save').onclick = () => {
    const p = preview();
    if (!p) return;
    const b = state.best[p.id];
    const old = b && rate(p.id, state.sex, state.bw, b.kg, b.reps);
    if (old && old.oneRm >= p.r.oneRm && !second('save', $('save'), `Thấp hơn kỷ lục ${load(p.id, b.kg)} × ${b.reps}. Bấm lần nữa để ghi đè`)) return;
    $('save').textContent = 'Lưu kỷ lục';
    const before = overallNow;
    state.best[p.id] = { kg: p.kg, reps: p.reps };
    persist();
    render();
    const o = overallNow, name = EXERCISES[p.id].name;
    let msg = !old ? 'Đã lưu kỷ lục' : p.r.oneRm > old.oneRm ? 'Đã lưu kỷ lục mới 💪' : 'Đã lưu kỷ lục';
    // Lên rank lớn: màn hình chúc mừng. Lên bậc phụ: chỉ một dòng thông báo.
    if (!before || o.tier > before.tier) levelUp(o, before ? 'Bạn đã lên hạng tổng' : 'Hạng tổng đầu tiên của bạn');
    else if (old && p.r.tier > old.tier) levelUp(p.r, `${name} lên hạng`);
    else if (level(o) > level(before)) msg = `Hạng tổng lên ${label(o.tier, o.sub)} 🎉`;
    else if (old && level(p.r) > level(old)) msg = `${name} lên ${label(p.r.tier, p.r.sub)} 🎉`;
    $('msg').textContent = msg;
    $('kg').value = $('reps').value = '';
    preview();
  };

  $('list').onclick = e => {
    const del = e.target.closest('[data-del]');
    if (del) {
      if (second('del:' + del.dataset.del, del, 'Xóa?')) { delete state.best[del.dataset.del]; persist(); render(); }
      return;
    }
    const li = e.target.closest('[data-id]');
    if (!li) return;
    $('ex').value = li.dataset.id;
    $('msg').textContent = '';
    preview();
    $('ex').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('kg').focus({ preventScroll: true });
  };

  const dlg = $('profile');
  const openProfile = () => {
    dlg.querySelector(`input[value="${state.sex}"]`).checked = true;
    $('bw').value = state.bw || '';
    dlg.showModal();
  };
  $('me').onclick = openProfile;
  $('overall').onclick = e => e.target.closest('#start') && openProfile();
  dlg.addEventListener('close', () => {
    const bw = parseFloat($('bw').value);
    if (bw >= 30 && bw <= 250) state.bw = bw;
    state.sex = dlg.querySelector('input[name=sex]:checked').value;
    persist();
    render();
    preview();
  });

  render();
  preview();
</script>
</body>
</html>
